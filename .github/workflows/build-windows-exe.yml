name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "**.spec"
      - "requirements.txt"
      - "app.ico"
      - "tessdata/**"
      - "offline_voice_models/**"
      - "private_voice_models/**"
      - "tikun-korim-pages-nikud/**"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Torah audio index
        shell: pwsh
        run: |
          python -m unittest -v test_torah_audio_index.py

      - name: Build Torah corpus and audio index
        shell: pwsh
        run: |
          python build_nikud_corpus.py

      - name: Upload Torah index artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Torah-Audio-Index
          path: |
            torah_nikud.json
            torah_audio_index.json
          if-no-files-found: error
          retention-days: 30

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm DukReportReader.spec

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/DukReportReader.exe")) {
            throw "DukReportReader.exe was not created"
          }
          Get-Item "dist/DukReportReader.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DukReportReader-Windows
          path: dist/DukReportReader.exe
          if-no-files-found: error
          retention-days: 30
